server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The browser calls /api/...; the API serves /... so strip the prefix.
    location /api/ {
        proxy_pass http://api:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-sent events must not be buffered or cached.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # `/docs` has no trailing slash; redirect so relative links resolve.
    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
        index index.html;
        # Markdown is readable as plain text; the index page stays HTML.
        types {
            text/html html;
            text/plain md;
        }
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Machine-readable map for LLM tooling.
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the shell: a stale index.html would point at deleted assets.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side router: unknown paths return the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
