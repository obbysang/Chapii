name: agentvault

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentvault}
      POSTGRES_DB: ${POSTGRES_DB:-agentvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agentvault} -d ${POSTGRES_DB:-agentvault}']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default. Uncomment to inspect with a local client.
    # ports:
    #   - '5432:5432'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentvault}:${POSTGRES_PASSWORD:-agentvault}@db:5432/${POSTGRES_DB:-agentvault}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      NEAR_NETWORK: ${NEAR_NETWORK:-local}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-}
      INDEXER_POLL_MS: ${INDEXER_POLL_MS:-2500}
      LOCAL_MODE_ENABLED: ${LOCAL_MODE_ENABLED:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_VAULT_ID: ${DEMO_VAULT_ID:-demo.agentvault.testnet}
      DEMO_OWNER_ID: ${DEMO_OWNER_ID:-demo-owner.testnet}
      DEMO_FUNDING_NEAR: ${DEMO_FUNDING_NEAR:-250}
      HARNESS_ENABLED: ${HARNESS_ENABLED:-true}
      HARNESS_PER_HOUR: ${HARNESS_PER_HOUR:-3}
      HARNESS_OWNER_ACCOUNT_ID: ${HARNESS_OWNER_ACCOUNT_ID:-}
      HARNESS_OWNER_PRIVATE_KEY: ${HARNESS_OWNER_PRIVATE_KEY:-}
      EXECUTOR_ACCOUNT_ID: ${EXECUTOR_ACCOUNT_ID:-}
      EXECUTOR_PRIVATE_KEY: ${EXECUTOR_PRIVATE_KEY:-}
      ONECLICK_API_URL: ${ONECLICK_API_URL:-https://1click.chaindefuser.com}
      ONECLICK_JWT: ${ONECLICK_JWT:-}
      EXECUTOR_POLL_MS: ${EXECUTOR_POLL_MS:-5000}
    ports:
      - '${API_PORT:-8787}:8787'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
