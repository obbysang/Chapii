[workspace]
members = ["vault", "mock-ft"]
resolver = "2"

[workspace.dependencies]
near-sdk = "5.30.1"
# borsh 1.x derives need `borsh` to be a direct dependency of the crate that
# uses them, so it cannot come only from near-sdk's re-export.
borsh = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
