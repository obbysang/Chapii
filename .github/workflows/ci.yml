name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.29.3'

jobs:
  typecheck:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentvault/api db:generate
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    name: Workspace tests and harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentvault/api db:generate
      - run: pnpm build
      - run: pnpm test
      - name: Red-team harness (34 scenarios, local, no keys)
        run: pnpm harness --json harness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: harness-report.json
          if-no-files-found: ignore

  contract:
    name: Contract build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: cargo test
        run: cargo test --manifest-path contracts/Cargo.toml
      - name: wasm release build
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Collect artifacts
        run: |
          mkdir -p build/contracts
          cp contracts/target/wasm32-unknown-unknown/release/agentvault_vault.wasm build/contracts/vault.wasm
          cp contracts/target/wasm32-unknown-unknown/release/agentvault_mock_ft.wasm build/contracts/mock_ft.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: build/contracts/*.wasm

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentvault/api db:generate
      - run: pnpm --filter @agentvault/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: agentvault-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: agentvault-web:ci
          build-args: |
            VITE_API_BASE=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
